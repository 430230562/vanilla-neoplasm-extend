content.planet.name = Planet

planet.vne-ochre.name = Ochre
planet.vne-ochre.description = A gas giant far from the sun.\nStrong radiation from metallic hydrogen reactions hinders exploration plans; research is ongoing.

sector.vne-[Neop1]fumarole.name = Fumarolic Wasteland
sector.vne-[Neop1]fumarole.description = [lightgray]The enemy has established facilities here to conduct secret research related to [accent]neoplasm[lightgray].\nDestroy this stronghold to cut off their subsequent research plans and seize stored research results.\n\nAuthor: -YOXILIS-
sector.vne-[Neop1]fumarole.details = This is only the beginning of the conspiracy. The enemy’s hidden schemes run far deeper than what we can see.
sector.vne-[Neop2]faultline.name = Fault Zone
sector.vne-[Neop2]faultline.description = [lightgray]Tectonic plates have split and uplifted, forming this vast crimson wasteland.\nThe land is dyed dark red. Is it the natural color of the strata, or caused by [accent]neoplasm[lightgray] seeping into the soil? No one knows for sure, but the abnormally high efficiency of cultivation equipment here has already given subtle clues.\n\nThe enemy has built three strongholds here to cover more dangerous neoplasm research. Their experiments have achieved initial success, and new‑style weapons have emerged. Remain highly vigilant.\n\nAuthor: -YOXILIS-
sector.vne-[Neop2]faultline.details = Is neoplasm a material mutation or an alternative form of life? The world remains doubtful. Research inevitably breeds pollution, and pollution inevitably triggers crises—not only conflicts among surface civilizations, but also unknown tremors from deep beneath the earth.
sector.vne-[Neop3]sinkhole.name = Sinkhole
sector.vne-[Neop3]sinkhole.description = [lightgray]A massive sinkhole formed by ground collapse, with extensive arkycite lakes occupying its bottom.\nThe area contains extremely rich organic matter, serving as both an excellent energy fuel and premium raw material for cultivating neoplasm creatures.\n\nThe enemy has deployed three strongholds inside the sinkhole. Though not equipped with cutting‑edge weaponry, their heavy fortifications are enough to deter most intruders.\n\nAuthor: -YOXILIS-
sector.vne-[Neop3]sinkhole.details = The deep sinkhole conceals endless organic matter and arkycite resources. It acts as a natural energy treasure trove, yet also a breeding ground for neoplasm. Danger and opportunity coexist here.

status.vne-neoplasm-slow.name = Neoplasm Slowdown

liquid.vne-acid.name = Acid Liquid
liquid.vne-acid.description = A strong acid capable of corroding most substances.
liquid.vne-venous.name = Venous Plasma
liquid.vne-venous.description = Nutrient-depleted plasma, darker in color, less fluid.\n\nCan be revitalized in respiratory tissues.
liquid.vne-nutrient.name = Nutrient Solution
liquid.vne-nutrient.description = A nutrient-rich liquid used to cultivate organisms.
liquid.vne-ammonia.name = Ammonia
liquid.vne-ammonia.description = NH₃ gas, with a strong pungent odor, an important chemical raw material.\n\nSeems to inhibit Neoplasm and its parasites.

item.vne-protein.name = Neoplasm Protein
item.vne-protein.description = Dead Neoplasm, but not completely lifeless. Under suitable conditions, it may regain activity.
item.vne-coagulant-ingot.name = Coagulant Ingot
item.vne-coagulant-ingot.description = Oxide adsorbed with Neoplasm, still restless inside. Recommended to incinerate.\n\nBut perhaps it has other uses.
item.vne-biomass-steel.name = Biomass Steel
item.vne-biomass-steel.description = A mysterious material, synthesized from oxides, carbides, and tumor protein blocks, with extremely high strength and toughness.\n\nIts production process is very complex, but once successful, it can greatly improve building defenses.

unit.vne-haploid.name = Haploid
unit.vne-haploid.description = Basic swarm unit, sprays acid liquid at targets. Absorbs nearby plasma to self-heal, leaves plasma upon death.
unit.vne-diploid.name = Diploid
unit.vne-diploid.description = Core swarm unit, sprays large amounts of acid liquid at distant units and buildings. Absorbs plasma to heal, leaves plasma upon death.
unit.vne-triploid.name = Triploid
unit.vne-triploid.description = Elite swarm unit, cannot attack directly, launches suicide bugs to attack buildings. Absorbs plasma to heal, leaves large plasma upon death.
unit.vne-bivalents.name = Bivalent
unit.vne-ribosome.name = Ribosome
unit.vne-ribosome.description = Basic swarm unit, follows the nearby unit with highest HP, assists in combat. Absorbs plasma to heal, leaves plasma upon death.
unit.vne-lysosome.name = Lysosome
unit.vne-lysosome.description = Core swarm unit, uses height advantage to bombard buildings with acid projectiles. Absorbs plasma to heal, leaves plasma upon death.
unit.vne-trichocyst.name = Trichocyst
unit.vne-trichocyst.description = Elite swarm unit, fires high-pressure acid streams capable of piercing buildings. Absorbs plasma to heal, leaves plasma upon death.
unit.vne-centrosome.name = Centrosome
unit.vne-bomber.name = Bomber
unit.vne-bomber.description = Vanguard swarm unit, destroys buildings via suicide attacks, spreading plasma on the ground.
unit.vne-cytoderm.name = Cell Wall
unit.vne-cytoderm.description = Core swarm unit, equipped with corrosive field and shield, cannot attack but provides strong protective effect for other units. Absorbs plasma to heal, leaves plasma upon death.

block.vne-neoplasm-wall.name = Blood Wall
block.vne-neoplasm-stone.name = Blood Stone
block.vne-neoplasm-vent.name = Blood Stone Vent (Ammonia)
block.vne-neoplasm-sand.name = Blood Sand
block.vne-neoplasm.name = Blood Pool

block.vne-incubator.name = Incubator
block.vne-incubator.description = Device used to stimulate and cultivate trace Neoplasm in the environment.
block.vne-incubator.details = On Erikel, Neoplasm residues are everywhere.\nWe must carefully control cultivation scale and strictly deactivate, or these restless organisms may escape control.
block.vne-adsorbent.name = Adsorbent
block.vne-adsorbent.description = Equipment that treats Neoplasm with porous oxide. However, only adsorbs, and the Neoplasm inside is still dangerous.

block.vne-ammonia-plant.name = Ammonia Plant
block.vne-ammonia-plant.description = Factory for synthesizing ammonia, combining nitrogen and hydrogen under high temperature and pressure. A key part of modern chemical industry.
block.vne-laser-incinerator.name = Laser Incinerator
block.vne-laser-incinerator.description = Incinerator that uses high-temperature laser to incinerate items, really consumes a lot of power.

block.vne-turbopump.name = Turbo Pump
block.vne-turbopump.description = Pumps liquid, requires electricity. Can also add hydrogen to boost efficiency to 1.5x.
block.vne-biomass-conduit.name = Biomass Steel Conduit
block.vne-biomass-conduit.description = Transports fluid while transmitting power, does not accept side fluid input, no leakage.
block.vne-biomass-liquid-router.name = Biomass Steel Liquid Router
block.vne-shaper.name = Shaper
block.vne-shaper.description = Device used to cultivate swarm units.
block.vne-biomass-liquid-router.description = Distributes fluid and power equally to all side directions.
block.vne-biomass-liquid-junction.name = Biomass Steel Liquid Junction
block.vne-biomass-liquid-junction.description = Bridge of two crossing biomass steel conduits.
block.vne-biomass-conduit-bridge.name = Biomass Steel Liquid Belt Bridge
block.vne-biomass-conduit-bridge.description = Transports fluid and power across any terrain or structure.

block.vne-oxide-wall.name = Oxide Wall
block.vne-oxide-wall.description = Protects own buildings, blocks enemy shells. Can absorb lasers and arcs, but also prevents automatic connection of power nodes. Can adsorb scattered Neoplasm on ground, but has adsorption limit.
block.vne-oxide-wall-large.name = Large Oxide Wall
block.vne-oxide-wall-large.description = Protects own buildings, blocks enemy shells. Can absorb lasers and arcs, but also prevents automatic connection of power nodes. Can adsorb scattered Neoplasm on ground, but has adsorption limit.
block.vne-coagulant-ingot-wall.name = Corrosive Tumor Block Wall
block.vne-coagulant-ingot-wall.description = Oxide wall that has adsorbed excessive Neoplasm but still stands at its post. Can absorb lasers and arcs, but also prevents automatic connection of power nodes. Releases Neoplasm when attacked.
block.vne-coagulant-ingot-wall-large.name = Large Corrosive Tumor Block Wall
block.vne-coagulant-ingot-wall-large.description = Large oxide wall that has adsorbed excessive Neoplasm but still stands at its post. Can absorb lasers and arcs, but also prevents automatic connection of power nodes. Releases Neoplasm when attacked.
block.vne-biomass-wall.name = Biomass Steel Wall
block.vne-biomass-wall.description = Protects own buildings, blocks enemy shells. Can absorb lasers and arcs, but also prevents automatic connection of power nodes. Will not be pierced.
block.vne-biomass-wall-large.name = Large Biomass Steel Wall
block.vne-biomass-wall-large.description = Protects own buildings, blocks enemy shells. Can absorb lasers and arcs, but also prevents automatic connection of power nodes. Will not be pierced.
block.vne-explosive.name = Explosive
block.vne-explosive.description = Mysterious square box with powerful explosives inside, explodes when destroyed or manually triggered.\n\nLoading corrosive tumor block may increase explosive power.
block.vne-explosive.details = What's this? Click?
block.vne-ammonia-plant.details = Although the Haber process has existed for centuries, it remains the mainstream synthesis method.\n\nPerhaps electrochemical methods could be used if suitable electrode materials are available.

block.vne-watergas-stove.name = Water-Gas Stove
block.vne-watergas-stove.description = Device that generates hydrogen by reacting graphite and water, requires large amounts of heat.

block.vne-unit-incubator.name = Unit Incubator
block.vne-unit-incubator.description = Device used to cultivate swarm units.

block.vne-biomass-reactor.name = Biomass Reactor
block.vne-biomass-reactor.description = Our engineers proposed a stunning idea: using the heat from Neoplasm growth to generate electricity. This is the result.\n\nBut honestly, its stability is questionable: too unstable and it explodes, too much Neoplasm and it explodes; plus, it causes significant pollution.\n\nIf possible, better to use a proper reactor.
block.vne-biomass-reactor.details = Actually, it has a nickname: Double-Boom Reactor.

stat.passable = Enemy Units Passable
stat.coolingamount = Cooling Boost
ability.infinityGrowth = Infinite Growth
techtree.seltis = Seltis

planet.vne-seltis.name = Seltis
planet.vne-seltis.description = One of the moons orbiting far from the gas giant (Ochre). In ancient times it was covered by vast oceans; now surface liquid water has almost vanished, leaving only endless salt-crust deserts and dried seabeds, with the remaining water bodies being extremely saline.

sinkhole.i = You feel tremors from deep underground...
sector.vne-[Neop4]badland.name = Lava Badland
sector.vne-[Neop4]badland.description = [lightgray]An enemy stronghold built near a volcano.\nAlthough the base is small, it is equipped with new-style shields and heavy turrets.\nSome experimental facilities have also begun to appear here.\n\nAuthor: Purple Seaweed (-YOXILIS-)
sector.vne-[Neop4]badland.details = It seems they have already opened Pandora's box.
sector.vne-[Neop5]infection.name = Corroded Wasteland
sector.vne-[Neop5]infection.description = [lightgray]An area near the fault zone, with a large expanse of red organic matter covering the region.\nIf nothing unexpected happens, this should be the enemy's last Neoplasm testing base on Erikel, and also their most heavily defended one.\nThe enemy's assault is unusually fierce; the initial defenses may not hold for long. Please reinforce your defenses as soon as possible.
sector.vne-[Neop5]infection.details = The final showdown!
sector.vne-[NeopI]mesa.name = Mesa Plateau
sector.vne-[NeopI]mesa.description = Located on Seltis.
sector.vne-[NeopI]mesa.details = Defense map test.

status.vne-neoplasm-slow.description = Movement is hindered by Neoplasm contamination.
status.vne-antagonistic.name = Antagonism
status.vne-stimulated.name = Stimulation

liquid.vne-brine.name = Brine
liquid.vne-brine.description = Water with a large amount of dissolved inorganic salts. Its osmotic pressure is so high that even Neoplasm cannot propagate in it.\n\nIt has no use before desalination.
liquid.vne-brine.details = Stop complaining - being able to find liquid surface water on Seltis is already very lucky.
liquid.vne-natural-gas.name = Natural Gas
liquid.vne-natural-gas.description = A gas extracted from arkycite, mainly composed of methane and acetylene.
liquid.vne-natural-gas.details = Compared to graphite, lower gaseous hydrocarbons undoubtedly have a larger contact area with reactants.

item.vne-salt.name = Salt
item.vne-salt.description = Common nitrate; after refining it can be used to make explosives.
item.vne-coagulant-ingot.details = The other use is, of course, as ammunition - it can greatly hinder the enemy's advance, but...
item.vne-nickel.name = Nickel
item.vne-nickel.description = A metal found everywhere, with balanced properties and wide applications.
item.vne-manganese.name = Manganese
item.vne-manganese.description = A less common metal, harder and more brittle than nickel, used to build sturdier structures. Its oxides can catalyze many chemical reactions.
item.vne-silicon-nitride.name = Nitride
item.vne-silicon-nitride.description = A hard, wear-resistant material commonly used to make components and structural parts for high-temperature and high-wear environments.

unit.renale.name = Fibroma
unit.latum.name = Tumor Core

unit.vne-midrib.name = Midrib
unit.vne-midrib.description = Swarm support unit capable of assisting construction. Absorbs nearby Neoplasm to self-repair, and leaves Neoplasm at its position upon death.
unit.vne-adventitious-root.name = Adventitious Root
unit.vne-adventitious-root.description = Swarm mining unit capable of extracting various minerals. Absorbs nearby Neoplasm to self-repair, and leaves Neoplasm at its position upon death.
unit.vne-bivalents.description = A special swarm unit with a dual structure and coordinated combat capability, skilled at melee disruption and soaking damage. Absorbs nearby Neoplasm to heal, and leaves Neoplasm upon death.
unit.vne-tetraploid.name = Tetraploid
unit.vne-tetraploid.description = The swarm's ultimate ground combat unit, equipped with four weapon systems that can simultaneously spray devastating Neoplasm flames and acid missiles. Continuously spreads Neoplasm and tears apart nearby enemies; splits into two Bivalents upon death. Absorbs nearby Neoplasm to heal, and leaves a large amount of Neoplasm upon death.
unit.vne-centrosome.description = The swarm's core support unit, capable of firing multiple high-pressure acid streams that deal devastating blows to defensive lines. Absorbs nearby Neoplasm to heal, and leaves Neoplasm upon death.
unit.vne-nucleus.name = Nucleus
unit.vne-nucleus.description = The swarm's aerial flagship, firing a high-energy armor-piercing railgun that summons Trichocysts on hit. Equipped with a point-defense system that intercepts incoming projectiles - the ruler of the skies. Absorbs nearby Neoplasm to heal, and leaves Neoplasm upon death.
unit.vne-cytoderm.details = Most high-rate-of-fire turrets are ineffective against it; energy weapons are recommended.
unit.vne-adenoma.name = Adenoma
unit.vne-adenoma.description = The swarm's support unit, providing synergistic buffs to nearby units. Absorbs nearby Neoplasm to heal, and leaves Neoplasm upon death.
unit.vne-papilloma.name = Papilloma
unit.vne-papilloma.description = The swarm's advanced aerial support unit, deploying a powerful shield and continuously healing nearby allies. Carries healing rays that quickly restore injured units. Absorbs nearby Neoplasm to heal, and leaves Neoplasm upon death.
unit.vne-carcinoma.name = Carcinoma
unit.vne-carcinoma.description = The swarm's ultimate support behemoth, releasing stimulation and overclock auras over a wide area, continuously healing and cleansing negative statuses. Can follow critically injured units to provide precise rescue - a mobile fortress on the battlefield. Absorbs nearby Neoplasm to heal, and leaves a large amount of Neoplasm upon death.
unit.vne-polyp.name = Polyp
unit.vne-polyp.description = A sticky, twisted, writhing, disgusting mass of amorphous tumor aggregate. Leaves a Neoplasm trail when moving, and leaves a large amount of Neoplasm upon death.
unit.vne-sarcoma.name = Sarcoma
unit.vne-sarcoma.description = A large sticky, twisted, writhing, disgusting mass of amorphous tumor aggregate. Leaves a Neoplasm trail when moving; upon death it splits into several pieces and leaves a large amount of Neoplasm.
unit.vne-metastasis.name = Metastasis
unit.vne-metastasis.description = A large sticky, twisted, writhing, disgusting mass of amorphous tumor aggregate. Continuously absorbs nearby Neoplasm to enlarge itself; the larger its size, the more pieces it splits into.
unit.vne-invasive.name = Invasive Carcinoma
unit.vne-invasive.description = A twisted, greedy, ever-expanding tumor aggregate. Grows slowly while continuously spreading Neoplasm; splits into multiple Metastases upon death. Leaves a sticky trail when moving, and releases a massive amount of Neoplasm upon death.
unit.vne-spore.name = Spore
unit.vne-mycelium.name = Mycelium
unit.vne-sac.name = Tumor Sac

unit.vne-election.name = Election
unit.vne-election.description = Protects the Stardust Core. Can mine minerals and construct buildings; equipped with a small repair field.
unit.vne-atom.name = Atom
unit.vne-atom.description = Protects the Moonbright Core. Can mine minerals and construct buildings; equipped with a small repair field.
unit.vne-molecule.name = Molecule
unit.vne-molecule.description = Protector of the Sunring Core. Can mine minerals and construct buildings; equipped with a small repair field.

block.vne-dense-neoplasm-stone.name = Dense Blood Stone
block.vne-rough-neoplasm-stone.name = Rough Blood Stone
block.vne-neoplasm-sand-wall.name = Blood Sand Wall
block.vne-neop-core.name = Tumor Heart
block.vne-neop-node.name = Tumor Vascular Bundle
block.vne-neop-turret.name = Tumor Turret
block.vne-spawner.name = Spawner

block.vne-ash.name = Stardust
block.vne-ash.description = A primary core with a built-in small RTG generator, providing power for the early development of the sector.
block.vne-albus.name = Moonbright
block.vne-albus.description = An intermediate core, upgraded from the primary core for greater capacity and protection; sturdier and larger. Equipped with a matrix shield generator.
block.vne-annular.name = Sunring
block.vne-annular.description = The ultimate core, fully upgraded from the intermediate core with greater capacity and more connection ports. Equipped with a cluster shield generator.
block.vne-core-fix.name = Patch Block
block.vne-core-fix.description = If you don't know what it's for, don't place it on the ground.

block.vne-nickel-drill.name = Nickel Drill
block.vne-nickel-drill.description = Basic mining equipment that slowly extracts minerals; operates without power.
block.vne-nickel-drill.details = Glorious industry is built on the coffin lids of Newton and Joule.
block.vne-manganese-drill.name = Manganese Drill
block.vne-manganese-drill.description = Advanced mining equipment that extracts minerals at normal speed without power, more efficient than the nickel drill.
block.vne-manganese-drill.details = I heard Faraday is pinned under the coffin lid too.

block.vne-micro-heat-redirector.name = Micro Heat Redirector
block.vne-micro-heat-redirector.description = A tiny device that directs heat to a specified direction, guiding local heat to factories or power units.
block.vne-small-heat-router.name = Small Heat Router
block.vne-small-heat-router.description = A small router that distributes heat among multiple directions, balancing regional temperature and stabilizing heat flow; suitable for medium-scale heat networks.
block.vne-micro-heat-router.name = Micro Heat Router
block.vne-micro-heat-router.description = A compact heat router for flow control and distribution in small heat networks; suitable for dense layouts and local heat management.

block.vne-incubator-large.name = Large Incubator
block.vne-incubator-large.description = A device used to stimulate and cultivate trace Neoplasm in the environment.
block.vne-arkycite-refinery.name = Arkycite Refinery
block.vne-arkycite-refinery.description = A factory that extracts graphite and biomass from arkycite, producing a small amount of natural gas.
block.vne-arkycite-refinery.details = Its efficiency isn't high, but it's still very useful in areas rich in arkycite.
block.vne-activator.name = Activator
block.vne-activator.description = A device that reactivates previously deactivated Neoplasm, used to make up for Neoplasm shortages.
block.vne-activator.details = We normally consider Neoplasm a waste product of dangerous biological reactions; actively producing it seems rather unusual.
block.vne-irradiation-chamber.name = Irradiation Chamber
block.vne-irradiation-chamber.description = A factory that uses radiation to mutate ordinary protein blocks into dormant cysts; failed mutations turn into Neoplasm. Neoplasm must be handled promptly or it will [accent]explode[].\nThe radiation source and protein blocks are not consumed in sync; the actual radiation source consumption rate is far lower than displayed in this interface.
block.vne-irradiation-chamber.details = Actually, its mutation success rate is already quite high.
block.vne-mixer.name = Cryofluid Mixer
block.vne-mixer.description = Uses silicon and water to synthesize cryofluid.
block.vne-silicon-nitride-furnace.name = Nitriding Furnace
block.vne-silicon-nitride-furnace.description = A reactor used to produce nitride, with heat as a by-product.
block.vne-silicon-nitride-furnace.details = A good friend of the atmospheric collector.
block.vne-biomass-smelter.name = Biomass Steel Furnace
block.vne-biomass-smelter.description = A high-temperature furnace for producing biomass steel; requires water for stability.
block.vne-stable-biomass-smelter.name = Stable Biomass Steel Furnace
block.vne-stable-biomass-smelter.description = A highly stable high-temperature furnace for biomass steel; no water needed for stability, but slightly slower.
block.vne-BMA-stove.name = Degussa Process Reactor
block.vne-BMA-stove.description = A factory that performs various syntheses using lower gaseous hydrocarbons, with hydrogen as a by-product.
block.vne-BMA-stove.details = Don't discard the excess hydrogen - it can be supplied to the pneumatic condenser.
block.vne-compressor.name = Compressor
block.vne-compressor.description = Compresses coal into graphite, requiring no power.
block.vne-arc-furnace.name = Arc Furnace
block.vne-arc-furnace.description = Smelts silicon and tempered glass.
block.vne-desalination.name = Desalination Plant
block.vne-desalination.description = Desalinates brine.

block.vne-nonvent-condenser.name = Non-Venting Condenser
block.vne-nonvent-condenser.description = [accent]Experimental[] condensing equipment that condenses steam into liquid water with high efficiency; but if water is not drained in time...\nRequires power to operate.
block.vne-pneumatic-condenser.name = Pneumatic Condenser
block.vne-pneumatic-condenser.description = A device that condenses steam into liquid water by lowering pressure; highly efficient and very safe.\nConsumes hydrogen to maintain the internal low-pressure environment.
block.vne-atmospheric-condenser.name = Atmospheric Condenser
block.vne-atmospheric-condenser.description = Condenses water vapor from the atmosphere into liquid water. Consumes power.
block.vne-atmospheric-condenser.details = We all agree this isn't a great idea, but if you're really short on water, it might still be of some use.
block.vne-floor-crusher.name = Floor Crusher
block.vne-floor-crusher.description = Crushes brittle ground to produce sand indefinitely at a slow rate. Requires a small amount of power.\nEfficiency varies by ground type.
block.vne-floor-crusher.details = No-prize quiz: what type is this thing?\nThe answer is revealed at the Advanced Floor Crusher.
block.vne-large-floor-crusher.name = Advanced Floor Crusher
block.vne-large-floor-crusher.description = Crushes brittle ground to produce sand indefinitely at a slow rate. Requires power.\nEfficiency varies by ground type. Can be sped up with natural gas.
block.vne-large-floor-crusher.details = It's an AttributeCrafter. Surprised?\n\nI think I disguised it very well as a drill.
block.vne-ammonia-collector.name = Ammonia Collector
block.vne-ammonia-collector.description = Collects ammonia emitted by vents; can only be placed on ammonia vents.

block.vne-duct-junction.name = Duct Junction
block.vne-duct-junction.description = A bridge for two crossing item ducts.

block.vne-nickel-conveyor.name = Nickel Conveyor
block.vne-nickel-conveyor.description = A conveyor made of nickel, slow in speed. Transmits power while moving items.
block.vne-manganese-conveyor.name = Manganese Conveyor
block.vne-manganese-conveyor.description = A conveyor upgraded with manganese, with an optimized drive system and armor. Transmits power while moving items.
block.vne-armored-conveyor.name = Armored Conveyor
block.vne-armored-conveyor.description = A further upgraded conveyor; does not accept side input and has strong damage resistance. Transmits power while moving items.
block.vne-biomass-conveyor.name = Biomass Steel Conveyor
block.vne-biomass-conveyor.description = A special conveyor made of biomass steel that packages items for transport, with high efficiency. Transmits power while moving items.
block.vne-junction.name = Nickel Junction
block.vne-junction.description = A conveyor junction that lets two conveyors cross without interfering with each other. Transmits power while moving items.
block.vne-nickel-bridge.name = Nickel Conveyor Bridge
block.vne-nickel-bridge.description = A conveyor bridge that spans 5 tiles to transport items; operates without power yet can transmit power to the other end.
block.vne-stack-bridge.name = Stack Conveyor Bridge
block.vne-stack-bridge.description = A stack conveyor bridge that spans 9 tiles to transport items and is compatible with stack conveyors; operates without power yet can transmit power to the other end.
block.vne-sorter.name = Nickel Sorter
block.vne-sorter.description = A sorter that outputs the specified item type forward and other types to the sides. Transmits power while moving items.
block.vne-inverted-sorter.name = Nickel Inverted Sorter
block.vne-inverted-sorter.description = Inverts sorter logic, outputting the specified item type to the sides and other types forward. Transmits power while moving items.
block.vne-overflow-gate.name = Nickel Overflow Gate
block.vne-overflow-gate.description = An overflow gate that prioritizes forwarding items; if the front is full, items are output to the sides. Transmits power while moving items.
block.vne-underflow-gate.name = Nickel Underflow Gate
block.vne-underflow-gate.description = Inverts overflow gate logic, prioritizing output to the sides; if the sides are full, items are forwarded. Transmits power while moving items.
block.vne-router.name = Nickel Router
block.vne-router.description = A distribution device that evenly outputs items to three other directions after input from one end. Transmits power while moving items.
block.vne-distributor.name = Nickel Distributor
block.vne-distributor.description = A large distribution device that evenly outputs items to other directions after input from one end. Transmits power while moving items.

block.vne-hydraulic-pump.name = Hydraulic Ram
block.vne-hydraulic-pump.description = A liquid extraction device that slowly extracts liquid, requiring no power.
block.vne-screw-pump.name = Screw Pump
block.vne-screw-pump.description = An improved liquid extraction device that extracts liquid fairly quickly, requiring power to operate.
block.vne-syphon-pump.name = Syphon Pump
block.vne-water-extractor.name = Water Extractor
block.vne-water-extractor.description = Extracts groundwater. But what comes out is still brine.
block.vne-current-conduit.name = Current Conduit
block.vne-current-conduit.description = Transmits power while transporting fluid.
block.vne-liquid-router.name = Current Liquid Router
block.vne-liquid-router.description = A liquid router that evenly outputs liquid to three other directions after input from one end.
block.vne-liquid-container.name = Small Current Liquid Container
block.vne-liquid-container.description = A liquid storage facility that holds a small amount of liquid.
block.vne-liquid-tank.name = Large Current Liquid Container
block.vne-liquid-tank.description = Expanded internal volume, reinforced main structure, and more ports; stores a larger amount of liquid.
block.vne-liquid-junction.name = Current Liquid Junction
block.vne-liquid-junction.description = A bridge for two crossing current conduits.
block.vne-conduit-bridge.name = Current Conduit Bridge
block.vne-conduit-bridge.description = A conduit bridge that spans 5 tiles to transport fluid and power.

block.vne-neoplasm-collecter.name = Neoplasm Collector
block.vne-neoplasm-collecter.description = Collects Neoplasm splashed on the ground within its range.
block.vne-neoplasm-collecter.details = Combined with certain buildings, it can generate Neoplasm infinitely.
block.vne-reinforced-force-projector.name = Reinforced Force Projector
block.vne-reinforced-force-projector.description = Generates a square force field that blocks enemy bullets and units.
block.vne-reinforced-force-projector-large.name = Large Reinforced Force Projector
block.vne-reinforced-force-projector-large.description = Generates an octagonal force field that blocks enemy bullets and units.
block.vne-force-projector-condenser.name = Heat Cycle Auxiliary
block.vne-force-projector-condenser.description = A device placed adjacent to a force projector that speeds up the force field's cooldown.

block.vne-silicon-nitride-wall.name = Nitride Wall
block.vne-silicon-nitride-wall.description = Protects allied buildings and blocks enemy shells. Can absorb lasers and arcs, but also prevents automatic power node connections.
block.vne-silicon-nitride-wall-large.name = Large Nitride Wall
block.vne-silicon-nitride-wall-large.description = Protects allied buildings and blocks enemy shells. Can absorb lasers and arcs, but also prevents automatic power node connections.
block.vne-nickel-wall.name = Nickel Wall
block.vne-nickel-wall.description = A defensive wall made of nickel that protects allied structures and blocks enemy projectiles.
block.vne-nickel-wall-large.name = Large Nickel Wall
block.vne-nickel-wall-large.description = A large defensive wall made of nickel that protects allied structures and blocks enemy projectiles.
block.vne-manganese-wall.name = Manganese Wall
block.vne-manganese-wall.description = A defensive wall made of manganese-nickel alloy that protects allied structures and blocks enemy projectiles.
block.vne-manganese-wall-large.name = Large Manganese Wall
block.vne-manganese-wall-large.description = A large defensive wall made of manganese-nickel alloy that protects allied structures and blocks enemy projectiles.

block.breach.vne-coagulant-ingot.info = Hindering Ammo: slows the enemy's advance; ineffective against Neoplasm units.
block.breach.vne-silicon-nitride.info = Suppression Ammo: effective against large groups of enemies.
block.breach.vne-biomass-steel.info = Armor-Piercing Ammo: each hit reduces the enemy's armor value.
block.titan.vne-coagulant-ingot.info = Hindering Ammo: leaves Neoplasm over a large area, slowing the enemy's advance; ineffective against Neoplasm units.
block.titan.vne-silicon-nitride.info = Lingering Fragmentation Ammo: leaves abundant shrapnel in the blast area, slowing enemies that try to pass through.
block.disperse.vne-coagulant-ingot.info = Trailing Liquid Ammo: the rapidly spinning projectile continuously flings out its Neoplasm payload, hindering air units while leaving a Neoplasm band that ground units struggle to cross; ineffective against Neoplasm units.
block.disperse.vne-silicon-nitride.info = Suppression Ammo: effective against large groups of enemies.

block.vne-defuse.name = Defuse
block.vne-defuse.description = Scatters an adsorbent that clears Neoplasm across a forward fan-shaped area.
block.vne-defuse.details = Type 1 to make diffuse automatically become defuse.
block.vne-catastrophe.name = Catastrophe
block.vne-catastrophe.description = Fires charged ammunition; each shot builds charge, and once fully charged it launches a grenade. Reloading is separate from the main gun.
block.vne-skyfire.name = Skyfire
block.vne-skyfire.description = A device that hurls explosives at long range, dealing damage to enemies over a wide area.
block.vne-skyfire.details = This thing packs quite a punch - it can instantly kill low-tier units.
block.vne-extinction.name = Extinction
block.vne-extinction.description = A turret that fires powerful armor-piercing rounds.

block.vne-unit-incubator.details = Don't let the low HP of swarm units fool you - in some situations they are remarkably tough.
block.vne-shaper.details = T2 doesn't look strong, but it's actually a bit tough to deal with.
block.vne-assist-incubator.name = Support Unit Incubator
block.vne-assist-incubator.description = A device used to cultivate swarm support units.\n\nIf the incubation process is interrupted, the immature deformed body will break out early.
block.vne-evolver.name = Mutation Accelerator
block.vne-evolver.description = A device that catalyzes swarm units to break through their evolutionary limits.\n\nIf the incubation process is interrupted, the immature deformed body will break out early.
block.vne-evolver.details = T3 units require a large amount of biomass to build, but their tactical value is absolutely worth the cost.\n\nIn plain terms: not a single one of them is easy to deal with.
block.vne-laboratory.name = Neoplasm Laboratory
block.vne-laboratory.description = A factory that converts Neoplasm into a sticky, twisted, writhing, disgusting mass of amorphous tumor aggregate.\n\nIts process is extremely chaotic, so the units it produces cannot be controlled.
block.vne-laboratory.details = In a sense, this is one way to handle Neoplasm.\nThough it causes even more pollution than dumping it directly.
block.vne-gene-forge-alpha.name = Gene Forge (Alpha)
block.vne-gene-forge-alpha.description = An evil device used to produce fusion organisms; this is the alpha model for producing ground units.
block.vne-gene-forge-alpha.details = The very first prototype of the gene forge, designed exclusively for the ground unit sequence.\n\nIts operating noise is hardly pleasant; many engineers would rather wear earplugs on shift.
block.vne-gene-forge-beta.name = Gene Forge (Beta)
block.vne-gene-forge-beta.description = An evil device used to produce fusion organisms; this is the beta model for producing air units.
block.vne-gene-forge-beta.details = A model tailored for the air unit sequence, its cooling system nearly twice as complex as the alpha model.\n\nAfter all, teaching a pile of wingless things to fly has to cost something.
block.vne-gene-forge-gamma.name = Gene Forge (Gamma)
block.vne-gene-forge-gamma.description = An evil device used to produce fusion organisms; this is the gamma model for producing support units.
block.vne-gene-forge-gamma.details = A model dedicated to the support sequence, with output deliberately lowered so those delicate support units can form safely.\n\nThe engineers insist this is for safety reasons, and absolutely not because they are afraid of those creations.
block.vne-gene-forge-omega.name = Gene Forge (Omega)
block.vne-gene-forge-omega.description = An evil device used to produce fusion organisms; this is the omega model for producing pure Neoplasm infections.
block.vne-gene-forge-omega.details = The pure Neoplasm infection model, and the least well-behaved of the four gene forges.\n\nNo one is willing to admit it starts up on its own at night, but the way the duty roster is arranged says everything.

block.vne-node-diode.name = Laser Node Diode
block.vne-node-diode.description = Transmits power in one direction only.
block.vne-assistant-battery.name = Auxiliary Battery
block.vne-assistant-battery.description = A battery used to store power, used together with the laser node diode.
block.vne-assistant-battery.details = One cell is stronger than six.
block.vne-oxidation-chamber.name = Oxidation Chamber
block.vne-oxidation-chamber.description = A generator that burns ammonia and requires ozone input. Can only be placed on ammonia vents.
block.vne-oxidation-chamber.details = On Erikel, where water is more precious than arkycite, of course the water produced by the reaction should be collected.
block.vne-beyond-reactor.name = Beyond Reactor
block.vne-beyond-reactor.description = [accent]Experimental device[]. A reactor that generates power using temperature differences; requires cryofluid to operate.\nWhile working it also incinerates Neoplasm, killing two birds with one stone.
block.vne-beyond-reactor.details = Legend says its efficiency exceeds the Carnot efficiency.
block.vne-slag-differential-generator.name = Slag Differential Generator
block.vne-slag-differential-generator.description = A thermoelectric generator placed on slag; requires cryofluid.
block.vne-monitor.name = Power Grid Monitor
block.vne-monitor.description = A tool for monitoring power grid generation and storage.
block.vne-monitor.details = I'm telling you the Seltis power grid is garbage - does anyone get it? ()